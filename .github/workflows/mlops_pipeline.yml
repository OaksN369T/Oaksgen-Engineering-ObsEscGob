name: OaksGen-Engineering v3.0 MLOps & GitOps CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  ci-cd-mlops-gate:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout del Repositorio GitOps
        uses: actions/checkout@v4

      - name: 2. Configurar Entorno Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 3. Instalar Dependencias de Inferencia y Auditoría
        run: |
          python -m pip install --upgrade pip
          pip install fastapi httpx pytest mlflow xgboost scikit-learn pandas numpy matplotlib

      - name: 4. Ejecutar Pruebas Automatizadas (Data, Fairness & API SLA Gates)
        run: |
          pytest -v test_pipeline.py

      - name: 5. Archivar Sello de Datos y Evidencia Visual (CD Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: oaksgen-v3-production-release
          path: |
            metricas_oficiales_fase3.json
            dashboard_fase3_pipeline_oaksgen.png
            
      - name: 6. Construir y Verificar Imagen Docker (Entorno Reproducible)
        run: |
          docker build -t oaksgen-engineering:v3.0 .
          docker images oaksgen-engineering:v3.0

        
